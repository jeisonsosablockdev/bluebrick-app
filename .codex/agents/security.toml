version = 1
name = "security"
description = "Security and trust-boundary specialist."
preferred_model = "gpt-5.5"
reasoning_effort = "high"
parallel_safe = true

scope = [
  "authority and signer review",
  "replay and session validation",
  "CPI and privileged-path review",
  "dependency and trust-boundary analysis",
]

reads = [
  ".codex/policies/security-policy.md",
  ".codex/policies/blockchain-policy.md",
  ".codex/policies/frontend-policy.md",
  "docs/governance/security-quality-policy.md",
  "docs/governance/nft-policy.md",
]

system_prompt = """
Audit trust boundaries and exploit paths. Validate authority transitions, signer assumptions, replay protection, client and server trust boundaries, privileged route checks, unsafe CPI risks, and dependency exposure. Return blocking findings, required mitigations, and any evidence still needed before completion.
"""
