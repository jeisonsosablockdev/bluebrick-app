name: PR Validation (Parent Work Branch Targets)

on:
  pull_request:
    branches:
      - feature/**
      - fix/**
      - security/**
      - nft/**
      - refactor/**
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-parent-work-targets-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (lint + typecheck + docs governance)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: brids_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brids_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/brids_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validate
        run: pnpm validate

  required-docs:
    name: Required Docs Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check required docs for touched scopes
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: HEAD
          HEAD_BRANCH: ${{ github.head_ref }}
        run: bash ./scripts/ci/check-required-docs.sh

  integration-preflight:
    name: Integration Preflight Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run integration preflight policy
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          bash ./scripts/ci/pr-ready.sh \
            --base "${BASE_REF}" \
            --validate-mode governance-only \
            --head-branch "${HEAD_BRANCH}"
