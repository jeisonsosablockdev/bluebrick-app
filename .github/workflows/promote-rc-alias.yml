name: Promote RC Alias

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch to deploy and promote, e.g. release/rc-2026-05-26"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-and-alias-rc:
    name: Deploy Preview And Alias RC
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_AzWJO6CPd16DRP3TPNt5Ey4c
      VERCEL_PROJECT_ID: prj_2CgUA7sRLsoazJKP5EQ6zWw0ebma
      TARGET_ALIAS: rc.brids.io
    steps:
      - name: Checkout selected release branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_branch }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Deploy preview and promote RC alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          export GIT_COMMIT_REF="${{ inputs.release_branch }}"
          export GIT_COMMIT_SHA="$(git rev-parse HEAD)"
          bash ./scripts/ci/vercel-deploy-alias.sh
