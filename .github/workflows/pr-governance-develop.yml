name: PR Governance Gates (Develop)

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - labeled
      - unlabeled
      - edited
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate (lint + typecheck + docs governance)
    if: ${{ contains(fromJson('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run validate
        run: npm run validate

  required-docs:
    name: Required Docs Sync Check
    if: ${{ contains(fromJson('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required docs for touched scopes
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: HEAD
          HEAD_BRANCH: ${{ github.head_ref }}
        run: bash ./scripts/ci/check-required-docs.sh

  governance-policy:
    name: PR Policy (labels, size, branch age, commits, template)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enforce PR governance policy
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const pr = context.payload.pull_request;
            const labels = pr.labels.map((l) => l.name);
            const body = (pr.body || "").toLowerCase();
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const policyPath = "docs/governance/pr-policy-source-of-truth.json";
            const policy = JSON.parse(fs.readFileSync(policyPath, "utf8"));

            const errors = [];

            const countInGroup = (group) => group.filter((label) => labels.includes(label)).length;

            const scopeLabels = policy.labels.scope;
            const typeLabels = policy.labels.type;
            const riskLabels = policy.labels.risk;
            const requiredSections = policy.requiredPrSections;
            const maxAddedLines = policy.thresholds.maxAddedLines;
            const maxBranchAgeDays = policy.thresholds.maxBranchAgeDays;
            const sizeExemptLabel = policy.labels.sizeExempt;
            const branchAgeExemptLabel = policy.labels.branchAgeExempt;
            const featureFlagRegex = new RegExp(policy.patterns.featureFlag);
            const conventionalRegex = new RegExp(policy.patterns.commitMessage);

            const scopeCount = countInGroup(scopeLabels);
            const typeCount = countInGroup(typeLabels);
            const riskCount = countInGroup(riskLabels);

            if (scopeCount !== 1) {
              errors.push(`Exactly one scope label is required. Allowed: ${scopeLabels.join(", ")}`);
            }
            if (typeCount !== 1) {
              errors.push(`Exactly one type label is required. Allowed: ${typeLabels.join(", ")}`);
            }
            if (riskCount !== 1) {
              errors.push(`Exactly one risk label is required. Allowed: ${riskLabels.join(", ")}`);
            }

            const missingSections = requiredSections.filter((section) => !body.includes(section));
            if (missingSections.length > 0) {
              errors.push(
                `PR body is missing required sections: ${missingSections.join(", ")}. Use the PR template.`
              );
            }

            const additions = pr.additions || 0;
            if (additions > maxAddedLines) {
              const hasSizeExempt = labels.includes(sizeExemptLabel);
              const mentionsFeatureFlag = featureFlagRegex.test(body);
              if (!hasSizeExempt) {
                errors.push(
                  `PR has ${additions} added lines (> ${maxAddedLines}). Split into smaller sequential PRs or add label '${sizeExemptLabel}' with justification and feature-flag plan.`
                );
              } else if (!mentionsFeatureFlag) {
                errors.push(
                  `PR uses '${sizeExemptLabel}' but does not mention a feature flag strategy in the PR body.`
                );
              }
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100
            });

            if (commits.length > 0) {
              const commitDates = commits
                .map((c) => new Date(c.commit.author?.date || c.commit.committer?.date).getTime())
                .filter((x) => Number.isFinite(x));

              if (commitDates.length > 0) {
                const earliest = Math.min(...commitDates);
                const ageDays = (Date.now() - earliest) / (1000 * 60 * 60 * 24);
                if (ageDays > maxBranchAgeDays && !labels.includes(branchAgeExemptLabel)) {
                  errors.push(
                    `Branch age is ${ageDays.toFixed(1)} days (> ${maxBranchAgeDays} days). Keep branches short-lived (1-3 days) or add '${branchAgeExemptLabel}' with justification.`
                  );
                }
              }

              const invalidCommits = commits
                .map((c) => {
                  const subject = (c.commit.message || "").split("\n")[0].trim();
                  return { sha: c.sha.slice(0, 7), subject };
                })
                .filter(({ subject }) => !conventionalRegex.test(subject));

              if (invalidCommits.length > 0) {
                const samples = invalidCommits.slice(0, 10).map((c) => `${c.sha} -> ${c.subject}`);
                errors.push(
                  `Commit message convention violation. Expected format: type(scope): summary. Examples: feat(app): ..., fix(program): ...\n${samples.join("\n")}`
                );
              }
            }

            if (errors.length > 0) {
              core.setFailed(errors.map((e, i) => `${i + 1}. ${e}`).join("\n"));
            } else {
              core.info("PR governance policy passed.");
            }
