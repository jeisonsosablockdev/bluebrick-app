name: Promote QA Alias

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-alias-qa:
    name: Deploy Preview And Alias QA
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_AzWJO6CPd16DRP3TPNt5Ey4c
      VERCEL_PROJECT_ID: prj_2CgUA7sRLsoazJKP5EQ6zWw0ebma
      TARGET_ALIAS: qa.brids.io
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Deploy preview and promote QA alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          export GIT_COMMIT_REF="${GITHUB_REF_NAME:-develop}"
          export GIT_COMMIT_SHA="$(git rev-parse HEAD)"
          bash ./scripts/ci/vercel-deploy-alias.sh
